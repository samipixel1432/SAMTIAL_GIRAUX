{% macro icon(name, cls='w-5 h-5') %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="{{ cls }}" aria-hidden="true">
{%- if name == 'gift' %}
  <rect x="4" y="10" width="16" height="9" rx="1"></rect>
  <rect x="3" y="7" width="18" height="3.5" rx="1"></rect>
  <line x1="12" y1="7" x2="12" y2="19"></line>
  <circle cx="9.5" cy="5" r="2"></circle>
  <circle cx="14.5" cy="5" r="2"></circle>
{%- elif name == 'cpu-chip' %}
  <rect x="7" y="7" width="10" height="10" rx="1"></rect>
  <rect x="10" y="10" width="4" height="4" rx="0.5"></rect>
  <line x1="9" y1="3" x2="9" y2="7"></line>
  <line x1="15" y1="3" x2="15" y2="7"></line>
  <line x1="9" y1="17" x2="9" y2="21"></line>
  <line x1="15" y1="17" x2="15" y2="21"></line>
  <line x1="3" y1="9" x2="7" y2="9"></line>
  <line x1="3" y1="15" x2="7" y2="15"></line>
  <line x1="17" y1="9" x2="21" y2="9"></line>
  <line x1="17" y1="15" x2="21" y2="15"></line>
{%- elif name == 'pencil' %}
  <path d="M16.862 4.487a2.1 2.1 0 1 1 2.969 2.969L8.25 18.938l-4 1 1-4L16.862 4.487Z"></path>
{%- elif name == 'trash' %}
  <rect x="6" y="8" width="12" height="12" rx="1"></rect>
  <line x1="4" y1="8" x2="20" y2="8"></line>
  <rect x="9" y="4" width="6" height="3" rx="0.5"></rect>
  <line x1="10" y1="11" x2="10" y2="17"></line>
  <line x1="14" y1="11" x2="14" y2="17"></line>
{%- elif name == 'eye' %}
  <path d="M2.25 12S5.5 5 12 5s9.75 7 9.75 7-3.25 7-9.75 7S2.25 12 2.25 12Z"></path>
  <circle cx="12" cy="12" r="3"></circle>
{%- elif name == 'eye-slash' %}
  <path d="M2.25 12S5.5 5 12 5s9.75 7 9.75 7-3.25 7-9.75 7S2.25 12 2.25 12Z"></path>
  <circle cx="12" cy="12" r="3"></circle>
  <line x1="3" y1="3" x2="21" y2="21"></line>
{%- elif name == 'camera' %}
  <path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z"></path>
  <circle cx="12" cy="13" r="3.5"></circle>
{%- elif name == 'plus' %}
  <line x1="12" y1="5" x2="12" y2="19"></line>
  <line x1="5" y1="12" x2="19" y2="12"></line>
{%- elif name == 'arrow-left' %}
  <line x1="19" y1="12" x2="5" y2="12"></line>
  <polyline points="12 19 5 12 12 5"></polyline>
{%- elif name == 'lock' %}
  <rect x="5" y="10" width="14" height="10" rx="1.5"></rect>
  <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
  <circle cx="12" cy="15" r="1.5"></circle>
{%- elif name == 'tag' %}
  <path d="M4 4h7l9 9-7 7-9-9V4Z"></path>
  <circle cx="8" cy="8" r="1.5"></circle>
{%- elif name == 'shopping-bag' %}
  <path d="M6 8h12l-1 12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 8Z"></path>
  <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
{%- elif name == 'watch' %}
  <circle cx="12" cy="12" r="5"></circle>
  <path d="M9 2h6l1 5H8l1-5Z"></path>
  <path d="M8 17h8l-1 5H9l-1-5Z"></path>
  <line x1="12" y1="9" x2="12" y2="12"></line>
  <line x1="12" y1="12" x2="14" y2="13.5"></line>
{%- elif name == 'home' %}
  <path d="M3 11.5 12 4l9 7.5"></path>
  <path d="M5.5 10.5V20h13v-9.5"></path>
  <path d="M10 20v-5h4v5"></path>
{%- elif name == 'phone' %}
  <rect x="7" y="3" width="10" height="18" rx="2"></rect>
  <line x1="10" y1="6" x2="14" y2="6"></line>
  <circle cx="12" cy="17" r="0.8"></circle>
{%- elif name == 'logout' %}
  <path d="M9 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h3"></path>
  <line x1="21" y1="12" x2="10" y2="12"></line>
  <polyline points="17 8 21 12 17 16"></polyline>
{%- elif name == 'light-bulb' %}
  <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.472V16a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.528A6 6 0 0 0 12 3Z"></path>
{%- elif name == 'cube' %}
  <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path>
  <path d="M4 7.5L12 12l8-4.5"></path>
  <line x1="12" y1="12" x2="12" y2="21"></line>
{%- elif name == 'check-circle' %}
  <circle cx="12" cy="12" r="9"></circle>
  <polyline points="8 12.5 11 15.5 16 9"></polyline>
{%- elif name == 'exclamation-triangle' %}
  <path d="M12 3l10 18H2L12 3Z"></path>
  <line x1="12" y1="9" x2="12" y2="14"></line>
{%- elif name == 'sun' %}
  <circle cx="12" cy="12" r="4"></circle>
  <line x1="12" y1="2.5" x2="12" y2="5"></line>
  <line x1="12" y1="19" x2="12" y2="21.5"></line>
  <line x1="4.5" y1="4.5" x2="6.25" y2="6.25"></line>
  <line x1="17.75" y1="17.75" x2="19.5" y2="19.5"></line>
  <line x1="2.5" y1="12" x2="5" y2="12"></line>
  <line x1="19" y1="12" x2="21.5" y2="12"></line>
  <line x1="4.5" y1="19.5" x2="6.25" y2="17.75"></line>
  <line x1="17.75" y1="6.25" x2="19.5" y2="4.5"></line>
{%- elif name == 'moon' %}
  <path d="M20 14.5A8 8 0 0 1 9.5 4a7 7 0 1 0 10.5 10.5Z"></path>
{%- elif name == 'chart-bar' %}
  <line x1="4" y1="20" x2="20" y2="20"></line>
  <rect x="6" y="13" width="3.2" height="7" rx="0.5"></rect>
  <rect x="10.8" y="9" width="3.2" height="11" rx="0.5"></rect>
  <rect x="15.6" y="5" width="3.2" height="15" rx="0.5"></rect>
{%- elif name == 'trending-up' %}
  <polyline points="4 16 10 10 14 14 20 6"></polyline>
  <polyline points="14 6 20 6 20 12"></polyline>
{%- endif %}
</svg>
{% endmacro %}
