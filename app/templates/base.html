<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mi Tienda{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="section-{{ section or 'default' }}">
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.home') }}">🛍️ Mi Tienda</a>
    <nav class="topnav">
      {% if is_admin %}
        <a class="pill" href="{{ url_for('main.add_product') }}">+ Producto</a>
        <form action="{{ url_for('main.logout') }}" method="post" class="inline-form">
          <button class="pill ghost" type="submit">Salir</button>
        </form>
      {% else %}
        <a class="pill ghost" href="{{ url_for('main.login') }}">Administrar</a>
      {% endif %}
    </nav>
  </header>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash-wrap">
        {% for message in messages %}
          <div class="flash">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
