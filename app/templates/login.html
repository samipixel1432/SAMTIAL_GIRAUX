{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Administrar{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm sm:mt-10">
  <div class="card p-7 shadow-card-hover">
    <div class="flex flex-col items-center text-center">
      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-slate-100 text-slate-600">
        {{ icon('lock', 'w-5 h-5') }}
      </span>
      <h1 class="mt-3 text-lg font-bold text-slate-900">Acceso de administrador</h1>
      <p class="mt-1 text-sm text-slate-500">Ingresa la clave para agregar o editar productos.</p>
    </div>

    <form method="post" class="mt-6 space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label for="password" class="field-label">Clave</label>
        <input type="password" name="password" id="password" class="field-input focus:ring-slate-900" required autofocus>
      </div>
      <button type="submit" class="btn w-full bg-slate-900 text-white hover:bg-slate-700 focus-visible:ring-slate-900">
        Entrar
      </button>
    </form>
  </div>
</div>
{% endblock %}
